<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0084FF" />
      <stop offset="50%" stop-color="#7B1FA2" />
      <stop offset="100%" stop-color="#FF5252" />
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF" />
      <stop offset="100%" stop-color="#1DE9B6" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background with Material Rounded Shape -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  
  <!-- Subtle inner shadow ring -->
  <rect x="8" y="8" width="496" height="496" rx="120" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="6" />

  <!-- Messenger Chat Bubble outline -->
  <path d="M256 96 C150 96 64 174 64 270 C64 322 92 368 138 400 L122 458 C120 464 126 470 132 467 L200 435 C218 440 237 444 256 444 C362 444 448 366 448 270 C448 174 362 96 256 96 Z" fill="#FFFFFF" fill-opacity="0.95" />
  
  <!-- Messenger Lightning Bolt in Gradient -->
  <path d="M280 180 L160 290 L235 290 L210 360 L330 250 L255 250 Z" fill="url(#bgGrad)" />
  
  <!-- E2EE Shield & Lock Badge at Bottom Right -->
  <g transform="translate(300, 300)" filter="url(#glow)">
    <circle cx="70" cy="70" r="64" fill="#0D47A1" stroke="#00E5FF" stroke-width="5" />
    <!-- Shield Icon -->
    <path d="M70 28 L104 44 V76 C104 98 89 116 70 122 C51 116 36 98 36 76 V44 Z" fill="url(#shieldGrad)" />
    <!-- Small Padlock inside Shield -->
    <rect x="62" y="70" width="16" height="14" rx="2" fill="#0D47A1" />
    <path d="M65 70 V64 A5 5 0 0 1 75 64 V70" fill="none" stroke="#0D47A1" stroke-width="2.5" />
  </g>
</svg>
